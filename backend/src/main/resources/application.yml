spring:
  application:
    name: queuewise-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/queuewise}
    username: ${DATABASE_USERNAME:queuewise}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

queuewise:
  jwt:
    issuer: ${JWT_ISSUER:queuewise-api}
    audience: ${JWT_AUDIENCE:queuewise-web}
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
